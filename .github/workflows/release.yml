name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: Build sdist
        working-directory: python-bindings
        run: uv build --sdist --no-sources
      - uses: actions/upload-artifact@v4
        with:
          name: dist-sdist
          path: python-bindings/dist
          if-no-files-found: error

  wheels:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - name: Verify tag matches package version
        working-directory: python-bindings
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(uv run python -c 'import tomllib; print(tomllib.load(open("Cargo.toml","rb"))["package"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match package version $version" >&2
            exit 1
          fi
      - name: Build wheel
        working-directory: python-bindings
        run: uv build --wheel --no-sources
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: python-bindings/dist
          if-no-files-found: error
