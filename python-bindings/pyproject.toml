[project]
name = "mcp-codebase-cartography"
description = "MCP server exposing AST-based tools and graph representations for efficiently exploring codebases."
dynamic = ["version"]
readme = "../README.md"
authors = [
    { name = "Nicolas Chagnet", email = "nchagnet@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "anyio>=4.0",
    "pyrefly>=1.2.0",
]

[project.scripts]
serve = "mcp_codebase_cartography.server:main"

[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "mcp_codebase_cartography._native"
features = ["pyo3/extension-module"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.pytest]
testpaths = [
    "tests"
]
