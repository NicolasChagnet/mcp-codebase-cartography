[package]
name = "python-bindings"
version = "1.1.0"
edition = "2024"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# Aliased so the extern name doesn't shadow the standard library `core` crate,
# which pyo3's macros reference in generated code.
cartography_core = { package = "core", path = "../core" }
pyo3 = { version = "0.23", features = ["abi3-py312", "extension-module"] }
